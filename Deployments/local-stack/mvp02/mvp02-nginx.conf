worker_processes 1;
error_log /dev/stderr crit;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 24446 ssl;
        server_name app.mvp02.zeka-m1.test;
        ssl_certificate /run/secrets/service.pem;
        ssl_certificate_key /run/secrets/service.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($http_host != "app.mvp02.zeka-m1.test:24446") { return 421; }
        root /usr/share/nginx/html;

        location /api/v1/browser-session/ { include /etc/nginx/mvp02-upstream.conf; }
        location /api/v1/browser-organisations/ { include /etc/nginx/mvp02-upstream.conf; }
        location /api/v1/tenant-access/ { include /etc/nginx/mvp02-upstream.conf; }
        location = /api/v1/beneficiaries/lookup { include /etc/nginx/mvp02-upstream.conf; }
        location ~ ^/api/v1/beneficiaries/[1-9][0-9]*/identity$ { include /etc/nginx/mvp02-upstream.conf; }
        location /api/ { return 404; }
        location = /health/live { include /etc/nginx/mvp02-upstream.conf; }
        location = /health/ready { include /etc/nginx/mvp02-upstream.conf; }
        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}

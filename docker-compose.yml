  zekaocelotgw:
     image: diliwo/ocelotapigateway
     build:
      context: .
      dockerfile: ApiGateways/Ocelot.ApiGateway/Dockerfile
      secrets:
        - github_token
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-host
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  authmanagement.api:
    image: diliwo/authmanagementapi
    container_name: zekaauthapi
    build:
        context: .
        dockerfile: Services/AuthManagement/AuthManagement.API/Dockerfile
        secrets:
          - github_token

secrets:
  github_token:
    environment: GITHUB_TOKEN


                check(all(v[k] for k in ['CookiesDisabled','RedirectDisabled','ProxyBypassed']) if accepted else v['CertificateSpecific'] and v['UntrustedRoot'] and 'authentication' in v['ExceptionKinds'], 'tls-controls')

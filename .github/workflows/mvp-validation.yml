name: MVP Validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: mvp-validation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  source_policy:
    name: Source Policy
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      trusted: ${{ steps.classify.outputs.trusted }}
    steps:
      - name: Classify pull-request source
        id: classify
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "${HEAD_REPOSITORY}" == "${BASE_REPOSITORY}" ]]; then
            echo "trusted=true" >> "${GITHUB_OUTPUT}"
            echo "Same-repository pull request: protected validation jobs are enabled."
          else
            echo "trusted=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Fork pull request::Secret-dependent validation is intentionally disabled. A maintainer must validate the commit from a same-repository branch."
          fi

  build_and_test:
    name: Build and non-PostgreSQL tests
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out pull-request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Reject tracked NuGet credentials
        run: ./scripts/security/check-nuget-credentials.sh

      - name: Restore solution with ephemeral package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore zeka-web-api.sln --configfile nuget.config

      - name: Build solution
        run: dotnet build zeka-web-api.sln --configuration Release --no-restore

      - name: Run non-PostgreSQL test projects
        shell: bash
        run: |
          test_projects=(
            "Services/AuthManager/Tests/Domain.UnitTests/Domain.UnitTests.csproj"
            "Services/AuthManager/Tests/Application.UnitTests/Application.UnitTests.csproj"
            "Tools/Zeka.AuthOwnerProvision.Tests/Zeka.AuthOwnerProvision.Tests.csproj"
            "Services/AuthManager/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj"
            "Services/AdminAreaManagement/Tests/Domain.UnitTests/Domain.UnitTests.csproj"
            "Services/AdminAreaManagement/Tests/Application.UnitTests/Application.UnitTests.csproj"
            "Services/ClientManagement/Tests/Domain.UnitTests/Domain.UnitTests.csproj"
            "Services/ClientManagement/Tests/Application.UnitTests/Application.UnitTests.csproj"
          )
          test_status=0
          for test_project in "${test_projects[@]}"; do
            echo "::group::dotnet test ${test_project}"
            if ! dotnet test "${test_project}" --configuration Release --no-build --no-restore; then
              test_status=1
            fi
            echo "::endgroup::"
          done
          exit "${test_status}"

  postgresql:
    # Keep the existing required-check name; this job also owns RabbitMQ startup coverage.
    name: PostgreSQL Testcontainers
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out pull-request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Verify Docker daemon availability
        run: docker info


      # This job alone uses the reviewed PR head. Other jobs retain their existing refs.
      - name: Record exact gateway source and prepare private evidence paths
        id: gateway_setup
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          umask 077
          raw="${RUNNER_TEMP}/pr93-gateway-private"
          safe="${RUNNER_TEMP}/pr93-gateway-safe"
          test ! -e "$raw" && test ! -e "$safe"
          mkdir "$raw" "$safe" "$raw/results" "$raw/receipts"
          printf 'GATEWAY_RAW=%s\nGATEWAY_SAFE=%s\n' "$raw" "$safe" >> "$GITHUB_ENV"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ && "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sources=(
            ApiGateways/Ocelot.ApiGateway/Program.cs
            Services/AuthManager/Tests/Infrastructure.IntegrationTests/GatewayBrowserTransportTests.cs
            Services/AuthManager/Tests/Infrastructure.IntegrationTests/PostgreSqlFixture.cs
          )
          : > "$raw/source-check.log"
          for source in "${sources[@]}"; do
            test -f "$source"
            test "$(git hash-object -- "$source")" = "$(git rev-parse "HEAD:$source")"
            sha256sum -- "$source" >> "$raw/source-check.log"
          done
          test "$(dotnet --version)" = 8.0.129
          dotnet --info > "$raw/sdk.log" 2>&1
          git show -s --format='%H%n%T%n%P' HEAD > "$raw/source.txt"
          printf '%s\n' "$EXPECTED_BASE" >> "$raw/source.txt"
          cat > "$raw/expected.json" <<'JSON'
          [
            [
              "Real_ocelot_provider_flow_keeps_choices_distinct_from_live_access_and_revokes_session(user: \"ada\", choices: 2)",
              "B"
            ],
            [
              "Real_ocelot_provider_flow_keeps_choices_distinct_from_live_access_and_revokes_session(user: \"ben\", choices: 1)",
              "B"
            ],
            [
              "Exact_route_and_credential_matrix_exposes_only_six_method_path_pairs",
              null
            ],
            [
              "Ordinary_URI_normalization_and_literal_TLS_target_are_observed_at_the_unchanged_gateway",
              null
            ],
            [
              "Owned_legacy_listener_is_disposed_on_success_and_startup_failure(failStartup: False)",
              "C-listener"
            ],
            [
              "Owned_legacy_listener_is_disposed_on_success_and_startup_failure(failStartup: True)",
              "C-listener"
            ],
            [
              "Exact_json_headers_cookies_and_framing_cross_real_ocelot(knownLength: True)",
              null
            ],
            [
              "Exact_json_headers_cookies_and_framing_cross_real_ocelot(knownLength: False)",
              null
            ],
            [
              "Attribution_is_exact_peer_fail_closed_and_backend_budgets_remain_independent_and_bounded",
              null
            ],
            [
              "Aggregate_budget_does_not_replace_per_address_admission",
              null
            ],
            [
              "Missing_or_invalid_required_configuration_disables_routes_without_legacy_fallback(key: \"GatewayBrowserTransport:Origin\", value: null)",
              null
            ],
            [
              "Missing_or_invalid_required_configuration_disables_routes_without_legacy_fallback(key: \"GatewayBrowserTransport:Origin\", value: \"http://browser.example.invalid\")",
              null
            ],
            [
              "Missing_or_invalid_required_configuration_disables_routes_without_legacy_fallback(key: \"GatewayBrowserTransport:DownstreamOrigin\", value: null)",
              null
            ],
            [
              "Missing_or_invalid_required_configuration_disables_routes_without_legacy_fallback(key: \"GatewayBrowserTransport:DownstreamOrigin\", value: \"https://target.example.invalid/prefix\")",
              null
            ],
            [
              "Missing_or_invalid_required_configuration_disables_routes_without_legacy_fallback(key: \"GatewayBrowserTransport:ClientPeers:0\", value: \"invalid\")",
              null
            ],
            [
              "Unavailable_database_overflow_and_downstream_emit_generic_no_store_without_cached_choices",
              null
            ],
            [
              "Lost_mutation_response_is_not_transparently_replayed_and_requires_explicit_recovery(action: \"restore\")",
              null
            ],
            [
              "Lost_mutation_response_is_not_transparently_replayed_and_requires_explicit_recovery(action: \"logout\")",
              null
            ],
            [
              "Isolated_gateway_case_and_real_handler_controls",
              "C-real-handler"
            ],
            [
              "Safe_legacy_diagnostics_are_attributable_with_profile_on_and_off(enabled: True)",
              "A"
            ],
            [
              "Safe_legacy_diagnostics_are_attributable_with_profile_on_and_off(enabled: False)",
              "A"
            ]
          ]
          JSON
          cat > "$raw/evidence.py" <<'PY'
          import collections, datetime, hashlib, json, os, pathlib, re, subprocess, sys, xml.etree.ElementTree as ET
          raw, safe = pathlib.Path(os.environ['GATEWAY_RAW']), pathlib.Path(os.environ['GATEWAY_SAFE'])
          CLASS = 'Infrastructure.IntegrationTests.GatewayBrowserTransportTests'
          rows = json.loads((raw/'expected.json').read_text())
          expected = [CLASS+'.'+name for name, _ in rows]
          methods = {name.split('(')[0] for name, _ in rows}
          umbrella = 'Isolated_gateway_case_and_real_handler_controls'
          tls = {life+'-'+name for life, names in {
              'normal': ['before','trusted','untrusted','after'],
              'startup-failure': ['before','after'],
              'abnormal-child': ['before','trusted','untrusted','terminated','after']}.items() for name in names}
          def check(ok, stage):
              if not ok: raise AssertionError(stage)
          def write(name, value):
              (safe/name).write_text(json.dumps(value, indent=2)+'\n')
          def digest(path):
              value=hashlib.sha256()
              with path.open('rb') as stream:
                for chunk in iter(lambda:stream.read(1048576),b''): value.update(chunk)
              return value.hexdigest()
          def trx(path, names, output):
              check(path.is_file() and path.stat().st_size < 20000000, 'trx-missing-or-size')
              tree = ET.parse(path); ns = {'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
              defs = {x.attrib['id']: x for x in tree.findall('.//t:TestDefinitions/t:UnitTest', ns)}
              results = tree.findall('.//t:Results/t:UnitTestResult', ns)
              counters = tree.find('.//t:ResultSummary/t:Counters', ns)
              check(counters is not None, 'trx-counters-missing')
              actual = []
              for result in results:
                  definition = defs.get(result.get('testId')); check(definition is not None, 'trx-definition-missing')
                  method = definition.find('t:TestMethod', ns); check(method is not None, 'trx-method-missing')
                  name = result.get('testName')
                  check(name in names and definition.get('name') == name, 'trx-wrong-identity')
                  check(method.get('className','').split(',')[0] == CLASS and method.get('name') == name[len(CLASS)+1:].split('(')[0], 'trx-wrong-method')
                  outcome = result.get('outcome')
                  check(outcome in {'Passed','Failed','NotExecuted','Inconclusive','Timeout','Aborted','Error'}, 'trx-outcome-schema')
                  actual.append({'name':name,'outcome':outcome})
              counts = {key:int(counters.get(key,'-1')) for key in ['total','executed','passed','failed','notExecuted']}
              write(output, {'derivative':'allowlisted-native-trx-identities-v1','originalSha256':digest(path),'counters':counts,'tests':actual})
              n = len(names)
              check(collections.Counter(x['name'] for x in actual) == collections.Counter(names), 'trx-selection-mismatch')
              check(all(x['outcome']=='Passed' for x in actual), 'trx-failure-or-skip')
              for key, value in {'total':n,'executed':n,'passed':n,'failed':0,'notExecuted':0}.items():
                  check(int(counters.get(key,'-1')) == value, 'trx-count-mismatch')
              entries = tree.findall('.//t:TestEntries/t:TestEntry', ns)
              check(collections.Counter((x.get('testId'),x.get('executionId')) for x in entries) == collections.Counter((x.get('testId'),x.get('executionId')) for x in results), 'trx-entry-mismatch')
          def discovery():
              # Listing admission proves explicit method coverage, never execution/theory expansion.
              limits = {'bytes':2000000, 'lines':10000, 'identityCharacters':1024, 'retainedUnknowns':128}
              project = 'Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj'
              command = ['dotnet','test',project,'--configuration','Release','--no-build','--no-restore','--list-tests']
              groups = {CLASS+'.'+method: [name for name in expected if name.split('(')[0] == CLASS+'.'+method] for method in methods}
              report = {'derivative':'allowlisted-native-discovery-v2', 'discoveryIsExecutionEvidence':False,
                'nativeCommand':{'argv':command,'filter':None,'exitCode':None},
                'originalOutput':{'bytes':None,'sha256':None,'hashStatus':'unavailable'}, 'limits':limits,
                'parserStatus':'rejected','firstRejectionCode':None,'rejectionCodes':[],
                'counts':{'outputLines':0,'listingHeaders':0,'observedEntries':0,'gatewayAttributableEntries':0,
                          'observedGatewayMethods':0,'enumeratedTheoryRows':0,'foldedTheoryMethods':0,'otherQualifiedEntries':0,'unknownEntries':0},
                'gatewayClass':CLASS,'safeIdentities':[], 'unknownEntries':[], 'unknownRecordsTruncated':False,
                'expectedCoverage':{'methods':sorted(groups),'executionRows':expected,'methodCount':12,'executionRowCount':21,
                  'originalSeven':{CLASS+'.'+name:target for name,target in rows if target}},
                'observedMethods':[], 'foldedTheories':[], 'enumeratedTheoryRows':[], 'notEnumeratedByListing':[],
                'missingMethods':[], 'missingEnumeratedRows':[], 'duplicateEntries':[], 'unexpectedEntries':[]}
              def reject(code):
                  if code not in report['rejectionCodes']: report['rejectionCodes'].append(code)
              def unknown(line, category, unexpected=False):
                  # ASCII alone is not a privacy allowlist; unknown names/arguments are never copied.
                  value = {'category':category,'characters':len(line),'sha256':hashlib.sha256(line.encode('utf-8')).hexdigest()}
                  if len(report['unknownEntries']) < limits['retainedUnknowns']: report['unknownEntries'].append(value)
                  else: report['unknownRecordsTruncated'] = True
                  if unexpected and len(report['unexpectedEntries']) < limits['retainedUnknowns']: report['unexpectedEntries'].append(value)
              def normalized(text):
                  # Ignore rendering whitespace and Boolean case only OUTSIDE quoted string values.
                  matches = list(re.finditer(r'"(?:[^"\\]|\\.)*"|[^"\s]+', text))
                  cursor=0; tokens=[]
                  for match in matches:
                      if text[cursor:match.start()].strip(): return None
                      tokens.append(match[0]); cursor=match.end()
                  if text[cursor:].strip(): return None
                  return ''.join(re.sub(r'\b(True|False)\b',lambda m:m[0].lower(),t) if not t.startswith('"') else t for t in tokens)
              display_rows = {normalized(name):name for name in expected}
              seen, folded, enumerated, observed_methods = collections.Counter(), set(), set(), set()
              status = raw/'discovery.exit'
              if status.is_file():
                  try:
                      with status.open('rb') as stream: data=stream.read(9)
                      value=data.decode('ascii').strip() if len(data)<=8 else ''
                  except (OSError,UnicodeDecodeError): value=''
                  if re.fullmatch(r'[0-9]{1,3}',value): report['nativeCommand']['exitCode']=int(value)
              if report['nativeCommand']['exitCode'] is None: reject('DISCOVERY_NATIVE_STATUS_UNAVAILABLE')
              elif report['nativeCommand']['exitCode'] != 0: reject('DISCOVERY_NATIVE_FAILURE')
              path=raw/'discovery.stdout'; lines=[]
              if not path.is_file(): reject('DISCOVERY_OUTPUT_MISSING')
              else:
                  size=path.stat().st_size; report['originalOutput']['bytes']=size
                  try:
                      with path.open('rb') as stream: data=stream.read(limits['bytes']+1)
                  except OSError:
                      data=None; reject('DISCOVERY_OUTPUT_UNREADABLE')
                  if data is None:
                      report['originalOutput']['hashStatus']='unavailable-read-failure'
                  elif size > limits['bytes'] or len(data)>limits['bytes']:
                      report['originalOutput'].update(hashStatus='unavailable-over-limit',prefixSha256=hashlib.sha256(data[:limits['bytes']]).hexdigest())
                      reject('DISCOVERY_OUTPUT_LIMIT')
                  else:
                      report['originalOutput'].update(sha256=hashlib.sha256(data).hexdigest(),hashStatus='complete')
                      try: lines=data.decode('utf-8-sig').splitlines()
                      except UnicodeDecodeError: reject('DISCOVERY_ENCODING_INVALID')
              report['counts']['outputLines']=len(lines)
              if len(lines)>limits['lines']: reject('DISCOVERY_LINE_LIMIT')
              lines=lines[:limits['lines']]
              headers=[i for i,line in enumerate(lines) if line.strip().lower()=='the following tests are available:']
              report['counts']['listingHeaders']=len(headers)
              if not headers: reject('DISCOVERY_LIST_HEADER_MISSING')
              elif len(headers)>1: reject('DISCOVERY_LIST_HEADER_DUPLICATE')
              if headers:
                for line in lines[headers[0]+1:]:
                  text=line.strip()
                  if not text or text.lower()=='the following tests are available:': continue
                  if re.match(r'^\[xUnit\.net [0-9:.]+\]',text):
                      unknown(text,'runner-diagnostic'); continue
                  report['counts']['observedEntries']+=1
                  if len(text)>limits['identityCharacters']:
                      unknown(text,'overlong-list-entry'); reject('DISCOVERY_IDENTITY_LIMIT'); continue
                  if not text.isascii() or any(ord(c)<32 or ord(c)==127 for c in text):
                      unknown(text,'unsupported-character-list-entry'); reject('DISCOVERY_UNSAFE_OR_UNKNOWN_IDENTITY'); continue
                  if text.startswith(CLASS+'.'):
                      report['counts']['gatewayAttributableEntries']+=1
                      suffix=text[len(CLASS)+1:]
                      match=re.fullmatch(r'([A-Za-z_][A-Za-z0-9_]*)(\(.*\))?',suffix)
                      method=CLASS+'.'+match[1] if match else None
                      if method not in groups:
                          unknown(text,'unexpected-gateway-method',True); reject('DISCOVERY_UNEXPECTED_GATEWAY_IDENTITY'); continue
                      observed_methods.add(method)
                      if match[2] is None or match[2]=='()':
                          identity=method; kind='folded-theory-method' if len(groups[method])>1 else 'fact-method'
                          if len(groups[method])>1: folded.add(method)
                      else:
                          identity=display_rows.get(normalized(text))
                          if identity is None:
                              unknown(text,'unexpected-gateway-display',True); reject('DISCOVERY_UNEXPECTED_GATEWAY_IDENTITY'); continue
                          kind='enumerated-theory-row'; enumerated.add(identity)
                      seen[identity]+=1
                      if len(report['safeIdentities'])<64:
                          report['safeIdentities'].append({'method':method,'displayName':text,'canonicalIdentity':identity,'kind':kind})
                  elif text.startswith('GatewayBrowserTransportTests.') or text.split('(')[0] in methods:
                      report['counts']['unknownEntries']+=1
                      unknown(text,'gateway-class-attribution-ambiguous'); reject('DISCOVERY_AMBIGUOUS_GATEWAY_IDENTITY')
                  elif re.fullmatch(r'(?:[A-Za-z_][A-Za-z0-9_+`]*\.){2,}[A-Za-z_][A-Za-z0-9_]*(?:\(.*\))?',text):
                      report['counts']['otherQualifiedEntries']+=1
                      unknown(text,'other-class-identity')
                  else:
                      report['counts']['unknownEntries']+=1
                      unknown(text,'unattributable-list-entry'); reject('DISCOVERY_AMBIGUOUS_IDENTITY')
              report['observedMethods']=sorted(observed_methods)
              report['foldedTheories']=sorted(folded)
              report['enumeratedTheoryRows']=sorted(enumerated)
              report['counts'].update(observedGatewayMethods=len(observed_methods),enumeratedTheoryRows=len(enumerated),foldedTheoryMethods=len(folded))
              report['missingMethods']=sorted(set(groups)-observed_methods)
              report['duplicateEntries']=[{'identity':name,'count':count} for name,count in sorted(seen.items()) if count>1]
              if not observed_methods: reject('DISCOVERY_ZERO_GATEWAY_METHODS')
              if report['missingMethods']: reject('DISCOVERY_MISSING_METHODS')
              if report['duplicateEntries']: reject('DISCOVERY_DUPLICATE_IDENTITY')
              for method,names in sorted(groups.items()):
                  if len(names)==1: continue
                  actual=set(names)&enumerated
                  if method in folded:
                      report['notEnumeratedByListing'].extend(names)
                      if actual: reject('DISCOVERY_MIXED_THEORY_REPRESENTATION')
                  elif actual and actual!=set(names):
                      report['missingEnumeratedRows'].extend(sorted(set(names)-actual)); reject('DISCOVERY_PARTIAL_THEORY_ENUMERATION')
              report['firstRejectionCode']=next(iter(report['rejectionCodes']),None)
              if not report['rejectionCodes']:
                  report['parserStatus']='admitted-method-coverage' if not enumerated else ('admitted-mixed-coverage' if folded else 'admitted-enumerated-coverage')
              # This file MUST exist before an admission error can escape to step/export gates.
              write('discovery.sanitized.json',report)
              check(not report['rejectionCodes'],report['firstRejectionCode'])
              return report
          def receipts():
              paths = list((raw/'receipts').rglob('gateway-receipts.jsonl')); records = []
              schemas = {
                'child-process': {'phase','identity','mode','started','finished','exitCode','killed','executed','passed','trxPresent','stdoutBytes','stderrBytes','assemblySha256','credentialEnvironmentInherited'},
                'child-final-absence': {'phase','identity','exited','exitCode','stdoutBytes','stderrBytes'},
                'browser-child-cleanup': {'phase','method','directoryAbsent','parentTrustUnchanged'},
                'TLS-control': {'phase','lifecycle','name','accepted','downstreamHttpReceipts','result'},
                'lifecycle-cleanup': {'phase','lifecycle','plannedStartupFailure','cleanup','failureKind','unknownOutcomes'}}
              cleanup = {'trusted-dispose','untrusted-dispose','proxy-dispose','trusted-listener-absent','untrusted-listener-absent','proxy-listener-absent','owned-directory-remove','owned-directory-absent','root-store-absent','ca-file-absent','ca-directory-absent','parent-trust-unchanged'}
              result_keys = {'Accepted','CertificateSpecific','NameValid','TimeValid','UntrustedRoot','CookiesDisabled','RedirectDisabled','ProxyBypassed','ExceptionKinds'}
              assembly = (raw/'assembly.sha256').read_text().strip()
              for path in paths:
                check(path.stat().st_size < 2000000, 'receipt-size')
                for line in path.read_text().splitlines():
                  r = json.loads(line); phase = r.get('phase')
                  check(phase in schemas and set(r) == schemas[phase], 'receipt-schema')
                  for key in ['identity','method']:
                    if key in r: check(r[key] in methods | tls, 'receipt-identity')
                  if 'lifecycle' in r: check(r['lifecycle'] in {'normal','startup-failure','abnormal-child'}, 'receipt-lifecycle')
                  if phase == 'TLS-control':
                    check(r['lifecycle']+'-'+r['name'] in tls and type(r['accepted']) is bool and type(r['downstreamHttpReceipts']) is int, 'tls-schema')
                    value = r['result']; check(set(value) == result_keys and all(type(value[k]) is bool for k in result_keys-{'ExceptionKinds'}), 'tls-result-schema')
                    check(type(value['ExceptionKinds']) is list and len(value['ExceptionKinds']) <= 10 and all(x in {'http','authentication','io','socket','other'} for x in value['ExceptionKinds']), 'tls-exception-category')
                  if phase == 'lifecycle-cleanup':
                    check(set(r['cleanup']) == cleanup and all(type(x) is bool or x is None for x in r['cleanup'].values()) and r['failureKind'] in {'none','control-failure'} and type(r['unknownOutcomes']) is int and type(r['plannedStartupFailure']) is bool, 'cleanup-schema')
                  for key in ['killed','trxPresent','credentialEnvironmentInherited','exited','directoryAbsent','parentTrustUnchanged']:
                    if key in r: check(type(r[key]) is bool or r[key] is None, 'receipt-boolean')
                  for key in ['exitCode','executed','passed','stdoutBytes','stderrBytes']:
                    if key in r: check(type(r[key]) is int or r[key] is None, 'receipt-integer')
                  if phase == 'child-process':
                    check(r['mode'] in {'browser','transport'} and re.fullmatch('[0-9a-fA-F]{64}', r['assemblySha256']) and r['assemblySha256'].lower() == assembly, 'child-assembly')
                    for key in ['started','finished']:
                      check(re.fullmatch(r'[0-9T:+.Z-]{20,40}', r[key]) is not None, 'child-timestamp')
                  records.append(r)
              # Only validated fixed-schema records reach the safe artifact; no raw test output.
              write('gateway-receipts.sanitized.json', {'derivative':'allowlisted-gateway-receipts-v1','records':records})
              by = lambda phase: [r for r in records if r['phase'] == phase]

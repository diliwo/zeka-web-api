  powershell_coverage:
    name: Windows PowerShell core coverage
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source with LF bytes for cross-runner source hashes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prove real PowerShell line collection and run credential-free core regressions
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualHead -cne $env:EXPECTED_HEAD) { throw 'POWERSHELL_COVERAGE_HEAD_MISMATCH' }
          # Core scope is native9 + atomic2 only. TLS file-only assertions remain owner-local evidence:
          # their mandatory Sonar CLI admission requires an unreleased Windows CI credential path.
          # The TLS test stays TEST source, and operational TLS code stays MAIN/uncovered in Sonar.
          $directory = Join-Path $env:RUNNER_TEMP 'zeka-powershell-coverage'
          & ./Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/Test-PowerShellCoverageChild.ps1 -Directory $directory
          [IO.File]::WriteAllText((Join-Path $directory 'source-revision.txt'), $actualHead, [Text.UTF8Encoding]::new($false))
          Write-Output 'TLS file-only CI coverage BLOCKED: mandatory Sonar CLI authentication is unavailable in this credential-free Windows job; no TLS runtime readiness is claimed.'

      - name: Prove owner admission with synthetic facts only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'zeka-owner-admission-tests'
          [IO.Directory]::CreateDirectory($directory) | Out-Null
          & ./Tools/Zeka.AuthOwnerProvision.Tests/OperatorBoundary/Test-OwnerAdmission.ps1 -ReportFile (Join-Path $directory 'owner-admission.json')
          & ./Tools/Zeka.AuthOwnerProvision.Tests/BuildContext/Test-OwnerHelperBuildContext.ps1 -ReportFile (Join-Path $directory 'build-context.json')

      - name: Retain safe synthetic owner admission proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-admission-synthetic-windows
          path: |
            ${{ runner.temp }}/zeka-owner-admission-tests/owner-admission.json
            ${{ runner.temp }}/zeka-owner-admission-tests/build-context.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain only coverage XML and source-bound safe counts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: powershell-line-coverage
          path: |
            ${{ runner.temp }}/zeka-powershell-coverage/powershell-coverage.xml
            ${{ runner.temp }}/zeka-powershell-coverage/powershell-coverage-result.json
            ${{ runner.temp }}/zeka-powershell-coverage/source-revision.txt
          if-no-files-found: error
          retention-days: 14

      - name: Retain safe launcher and native receipts separately from coverage import
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:

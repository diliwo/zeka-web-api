          path: |
            ${{ runner.temp }}/zeka-powershell-coverage/launcher-proof.json
            ${{ runner.temp }}/zeka-powershell-coverage/launcher-result.json
            ${{ runner.temp }}/zeka-powershell-coverage/native-result.json
          if-no-files-found: error
          retention-days: 14

  sonar:
    name: SonarQube Cloud / Quality Gate
    needs: [source_policy, powershell_coverage]
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out full pull-request history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Install pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.14

      - name: Download same-run execution-derived PowerShell coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: powershell-line-coverage
          path: TestResults/powershell-coverage

      - name: Verify PowerShell coverage source bytes, schema and actual count receipts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          directory = Path("TestResults/powershell-coverage")
          report = directory / "powershell-coverage.xml"
          summary_file = directory / "powershell-coverage-result.json"
          revision_file = directory / "source-revision.txt"
          if {item.name for item in directory.iterdir()} != {report.name, summary_file.name, revision_file.name}:
              raise SystemExit("PowerShell coverage artifact must contain exactly its three allowlisted files.")
          if (report.stat().st_size > 1_000_000 or summary_file.stat().st_size > 64_000
                  or revision_file.read_text(encoding="utf-8").strip() != os.environ["EXPECTED_HEAD"]):
              raise SystemExit("PowerShell coverage artifact is oversized or belongs to another source revision.")
          summary = json.loads(summary_file.read_text(encoding="utf-8"))
          if (summary.get("status") != "PASS" or summary.get("collectorProof") != "PASS"
                  or summary.get("nativeCasesPassed") != 9 or summary.get("atomicCasesPassed") != 2
                  or summary.get("coverageReport") != report.name
                  or hashlib.sha256(report.read_bytes()).hexdigest() != summary.get("coverageSha256")):
              raise SystemExit("PowerShell collector proof, regression counts or XML hash receipt is invalid.")
          expected = {"Deployments/local-stack/W3-NativeDiagnostics.ps1", "Deployments/local-stack/Initialize-Databases.ps1"}
          hashes = summary.get("sourceHashes", [])
          if len(hashes) != 2 or {item.get("path") for item in hashes} != expected:
              raise SystemExit("PowerShell coverage must name exactly its two core operational source files.")
          for item in hashes:
              digest = item.get("sha256", "")
              if (not re.fullmatch(r"[0-9a-f]{64}", digest)
                      or hashlib.sha256(Path(item["path"]).read_bytes()).hexdigest() != digest):
                  raise SystemExit("PowerShell coverage source bytes differ from this exact Linux checkout.")
          coverage = ET.parse(report).getroot()
          if coverage.tag != "coverage" or coverage.attrib != {"version": "1"}:
              raise SystemExit("PowerShell coverage must use the supported generic XML version 1 schema.")
          counts = {}
          for source in coverage:
              if source.tag != "file" or set(source.attrib) != {"path"} or source.get("path") not in expected or source.get("path") in counts:
                  raise SystemExit("PowerShell coverage contains an unexpected or duplicate source file.")
              path = source.attrib["path"]
              maximum = len(Path(path).read_text(encoding="utf-8-sig").splitlines())
              seen = set()
              covered = 0
              for line in source:
                  if line.tag != "lineToCover" or set(line.attrib) != {"lineNumber", "covered"}:
                      raise SystemExit("PowerShell coverage contains unsupported line metadata.")
                  number = int(line.attrib["lineNumber"])
                  if number <= 0 or number > maximum or number in seen or line.attrib["covered"] not in {"true", "false"}:
                      raise SystemExit("PowerShell coverage line numbers or actual-hit flags are invalid.")
                  seen.add(number)
                  covered += line.attrib["covered"] == "true"
              if not seen:
                  raise SystemExit("PowerShell coverage must report nonempty source line candidates.")
              counts[path] = (len(seen), covered)
          native = counts.get("Deployments/local-stack/W3-NativeDiagnostics.ps1")
          initialization = counts.get("Deployments/local-stack/Initialize-Databases.ps1")
          if (set(counts) != expected or not native or native[1] <= 0 or not initialization or initialization[1] != 0
                  or native != (summary.get("nativeStatementLines"), summary.get("nativeExecutedLines"))
                  or initialization != (summary.get("initializationStatementLines"), summary.get("initializationExecutedLines"))):
              raise SystemExit("PowerShell XML counts disagree with source-bound execution receipts.")
          print(f"Verified actual PowerShell core line hits: helper {native[1]}/{native[0]}; database initialization 0/{initialization[0]} (NOT RUN).")
          print("TLS CI coverage remains BLOCKED by mandatory scanner authentication; operational TLS code remains MAIN/uncovered.")
          PY

      - name: Verify SonarQube Cloud prerequisites
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          prerequisite_status=0
          if [[ -z "${SONAR_ORGANIZATION}" ]]; then
            echo "::error title=Missing Sonar variable::Repository variable SONAR_ORGANIZATION is required."
            prerequisite_status=1
          fi
          if [[ -z "${SONAR_PROJECT_KEY}" ]]; then
            echo "::error title=Missing Sonar variable::Repository variable SONAR_PROJECT_KEY is required."
            prerequisite_status=1
          fi
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::error title=Missing Sonar secret::Repository secret SONAR_TOKEN is required."
            prerequisite_status=1
          fi
          exit "${prerequisite_status}"

      - name: Restore scanner and solution with ephemeral package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary :all: \
            --requirement scripts/ci/requirements-coverage.txt
          dotnet tool restore --configfile nuget.config
          dotnet restore zeka-web-api.sln --configfile nuget.config

      - name: Begin pull-request analysis
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PR_BASE: ${{ github.base_ref }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.pullrequest.key="${SONAR_PR_KEY}" \
            /d:sonar.pullrequest.branch="${SONAR_PR_BRANCH}" \
            /d:sonar.pullrequest.base="${SONAR_PR_BASE}" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.python.coverage.reportPaths="TestResults/python-coverage/coverage.xml" \
            /d:sonar.coverageReportPaths="TestResults/powershell-coverage/powershell-coverage.xml" \
            /d:sonar.test.inclusions="scripts/ci/tests/test_application_conformance.py,Services/AuthManager/Tests/Infrastructure.IntegrationTests/Configuration/Test-Configuration.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/Test-DatabaseBootstrap.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/Test-W3NativeDiagnostics.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/Test-W3AtomicWrite.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/PowerShellLineCoverage.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/Test-PowerShellLineCoverage.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/Test-AuthHttpsConfiguration.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/PowerShellCoverageChild.ps1,Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration/Test-PowerShellCoverageChild.ps1,Tools/Zeka.AuthOwnerProvision.Tests/OperatorBoundary/Test-OwnerAdmission.ps1,Tools/Zeka.AuthOwnerProvision.Tests/BuildContext/Test-OwnerHelperBuildContext.ps1,Tools/Zeka.AuthOwnerProvision.Tests/BuildContext/Test-OwnerImageContainment.py" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.token="${SONAR_TOKEN}"

      - name: Build for analysis
        run: dotnet build zeka-web-api.sln --configuration Release --no-restore --no-incremental

      - name: Verify configuration assertions are classified as test source
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path.cwd()
          namespace = {"s": "http://www.sonarsource.com/msbuild/integration/2015/1"}
          script_projects = {
              **{(base / "Tools/Zeka.AuthOwnerProvision.Tests/BuildContext" / name).resolve():
                  (base / "Tools/Zeka.AuthOwnerProvision.Tests/Zeka.AuthOwnerProvision.Tests.csproj").resolve()
                  for name in ("Test-OwnerHelperBuildContext.ps1", "Test-OwnerImageContainment.py")},
              (base / "Tools/Zeka.AuthOwnerProvision.Tests/OperatorBoundary/Test-OwnerAdmission.ps1").resolve():
                  (base / "Tools/Zeka.AuthOwnerProvision.Tests/Zeka.AuthOwnerProvision.Tests.csproj").resolve(),
              (base / "Services/AuthManager/Tests/Infrastructure.IntegrationTests/Configuration/Test-Configuration.ps1").resolve():
                  (base / "Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj").resolve(),
              **{
                  (base / "Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration" / name).resolve():
                      (base / "Tools/Zeka.DbMigrate.Tests/Zeka.DbMigrate.Tests.csproj").resolve()
                  for name in ("Test-DatabaseBootstrap.ps1", "Test-W3NativeDiagnostics.ps1", "Test-W3AtomicWrite.ps1", "PowerShellLineCoverage.ps1", "Test-PowerShellLineCoverage.ps1", "Test-AuthHttpsConfiguration.ps1", "PowerShellCoverageChild.ps1", "Test-PowerShellCoverageChild.ps1")
              },
          }
          for script, project in script_projects.items():
              if not script.is_relative_to(project.parent):
                  raise SystemExit("Configuration assertions must physically belong to their test project.")
          owners = {script: set() for script in script_projects}
          for info in Path(".sonarqube/out").rglob("ProjectInfo.xml"):
              root = ET.parse(info).getroot()
              for result in root.findall("s:AnalysisResultFiles/s:AnalysisResultFile", namespace):
                  if result.get("Id") != "FilesToAnalyze":
                      continue
                  paths = Path(result.attrib["Location"]).read_text(encoding="utf-8-sig").splitlines()
                  analyzed = {Path(value).resolve() for value in paths if value}
                  owner = Path(root.findtext("s:FullPath", namespaces=namespace)).resolve()
                  category = root.findtext("s:ProjectType", namespaces=namespace)
                  excluded = root.findtext("s:IsExcluded", namespaces=namespace)
                  for script in owners.keys() & analyzed:
                      owners[script].add((owner, category, excluded))
          for script, project in script_projects.items():
              if owners[script] != {(project, "Test", "false")}:
                  raise SystemExit(f"Assertion script must be included by its exact non-excluded test project: {script.relative_to(base)}")
          print(f"{len(script_projects)} assertion sources are owned by their exact TEST projects; production classification is unchanged.")
          PY

      - name: Run Python accounting regressions and collect coverage for analysis
        shell: bash
        run: |
          set -euo pipefail
          coverage_dir="TestResults/python-coverage"
          coverage_file="${coverage_dir}/coverage.xml"
          test_log="${coverage_dir}/tests.log"
          mkdir -p "${coverage_dir}"
          export COVERAGE_FILE="${coverage_dir}/.coverage"
          python -m coverage erase
          python -m coverage run --branch \
            --include='scripts/ci/reconcile_application_conformance.py' \
            -m unittest discover -s scripts/ci/tests -p 'test_application_conformance.py' -v \
            2>&1 | tee "${test_log}"
          if grep -Eq '^OK \(skipped=[1-9][0-9]*\)$' "${test_log}" || ! grep -Eq '^OK$' "${test_log}"; then
            echo "Python accounting regressions did not complete without skips." >&2
            exit 1
          fi
          python -m coverage xml -o "${coverage_file}"
          COVERAGE_FILE="${coverage_file}" python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          coverage_file = Path(os.environ["COVERAGE_FILE"])
          root = ET.parse(coverage_file).getroot()
          classes = root.findall("./packages/package/classes/class")
          expected_file = "scripts/ci/reconcile_application_conformance.py"
          measured = [item for item in classes if item.get("filename") == expected_file]
          try:
              lines_valid = int(root.attrib["lines-valid"])
              lines_covered = int(root.attrib["lines-covered"])
          except (KeyError, TypeError, ValueError) as error:
              raise SystemExit("Python coverage report has invalid line counters.") from error
          if (root.tag != "coverage" or root.get("version") != "7.16.1"
                  or len(classes) != 1 or len(measured) != 1
                  or not measured[0].findall("./lines/line") or lines_valid <= 0):
              raise SystemExit("Python coverage report is malformed or missing the reconciler.")
          if lines_covered * 100 <= lines_valid * 80:
              raise SystemExit("Python reconciler line coverage is not strictly above 80%.")
          print(f"Verified Python reconciler line coverage: {lines_covered}/{lines_valid}")
          PY

      - name: Run complete suite and collect coverage for analysis
        run: |
          docker info
          dotnet test zeka-web-api.sln -m:1 --configuration Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Complete analysis and wait for Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
      - name: Verify the final scanner input keeps assertions in TEST scope
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import csv
          import re
          from pathlib import Path

          base = Path.cwd()
          assertion_scripts = {
              *{(base / "Tools/Zeka.AuthOwnerProvision.Tests/BuildContext" / name).resolve()
                for name in ("Test-OwnerHelperBuildContext.ps1", "Test-OwnerImageContainment.py")},
              (base / "Tools/Zeka.AuthOwnerProvision.Tests/OperatorBoundary/Test-OwnerAdmission.ps1").resolve(),
              (base / "Services/AuthManager/Tests/Infrastructure.IntegrationTests/Configuration/Test-Configuration.ps1").resolve(),
              *{
                  (base / "Tools/Zeka.DbMigrate.Tests/LocalStackConfiguration" / name).resolve()
                  for name in ("Test-DatabaseBootstrap.ps1", "Test-W3NativeDiagnostics.ps1", "Test-W3AtomicWrite.ps1", "PowerShellLineCoverage.ps1", "Test-PowerShellLineCoverage.ps1", "Test-AuthHttpsConfiguration.ps1", "PowerShellCoverageChild.ps1", "Test-PowerShellCoverageChild.ps1")
              },
          }
          main_scripts = {
              (base / "Tools/Zeka.AuthOwnerProvision/Prepare-OwnerHelperBuildContext.ps1").resolve(),
              *{(base / "Deployments/local-stack" / name).resolve()
                for name in ("Test-Configuration.ps1", "Test-DatabaseBootstrap.ps1", "Test-W3NativeDiagnostics.ps1", "Test-W3AtomicWrite.ps1",
                             "Initialize-Databases.ps1", "W3-NativeDiagnostics.ps1", "Initialize-AuthHttpsConfiguration.ps1", "Invoke-OwnerFirstAdmin.ps1")}
          }
          text = (base / ".sonarqube/out/sonar-project.properties").read_text(encoding="utf-8-sig")
          text = re.sub(r"\\\r?\n[ \t]*", "", text)
          scopes = {"sonar.tests": set(), "sonar.sources": set()}
          for line in text.splitlines():
              key, separator, value = line.partition("=")
              scope = next((name for name in scopes if key.strip().endswith(name)), None)
              if not separator or scope is None:
                  continue
              value = re.sub(r"\\([\\:= ,#!])", r"\1", value)
              scopes[scope].update(Path(path).resolve() for path in next(csv.reader([value], skipinitialspace=True)) if path)
          for script in assertion_scripts:
              if script not in scopes["sonar.tests"] or script in scopes["sonar.sources"]:
                  raise SystemExit(f"Assertion script must be TEST source in the final scanner input: {script.relative_to(base)}")
          for script in main_scripts:
              if script not in scopes["sonar.sources"] or script in scopes["sonar.tests"]:
                  raise SystemExit(f"Forwarding and operational entrypoints must remain MAIN source: {script.relative_to(base)}")
          print("Final scanner input: ten test harness/infrastructure scripts are TEST; forwarding and operational entrypoints remain MAIN.")
          PY

  mvp_validation:
    name: MVP Validation
    needs:
      - source_policy
      - build_and_test
      - postgresql
      - life05a_verifier
      - production_conformance
      - docker_images
      - powershell_coverage
      - sonar
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every MVP component
        env:
          TRUSTED_SOURCE: ${{ needs.source_policy.outputs.trusted }}
          BUILD_AND_TEST_RESULT: ${{ needs.build_and_test.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql.result }}
          LIFE05A_VERIFIER_RESULT: ${{ needs.life05a_verifier.result }}
          PRODUCTION_CONFORMANCE_RESULT: ${{ needs.production_conformance.result }}
          DOCKER_IMAGES_RESULT: ${{ needs.docker_images.result }}
          POWERSHELL_COVERAGE_RESULT: ${{ needs.powershell_coverage.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          if [[ "${TRUSTED_SOURCE}" != "true" ]]; then
            echo "::error title=Fork validation required::Secret-dependent jobs did not execute. Validate this commit from a same-repository branch before merge."
            exit 1
          fi

          aggregate_status=0
          for component_result in \
            "Build and non-PostgreSQL tests:${BUILD_AND_TEST_RESULT}" \
            "PostgreSQL Testcontainers:${POSTGRESQL_RESULT}" \
            "LIFE-05A synthetic verifier (exact head):${LIFE05A_VERIFIER_RESULT}" \
            "Issue 46 production conformance targets:${PRODUCTION_CONFORMANCE_RESULT}" \
            "Docker images (4):${DOCKER_IMAGES_RESULT}" \
            "Windows PowerShell core coverage:${POWERSHELL_COVERAGE_RESULT}" \
            "SonarQube Cloud / Quality Gate:${SONAR_RESULT}"
          do
            component_name="${component_result%%:*}"
            result="${component_result##*:}"
            if [[ "${result}" == "success" ]]; then
              echo "${component_name}: success"
            else
              echo "::error title=${component_name}::Required component concluded ${result}."
              aggregate_status=1
            fi
          done
          exit "${aggregate_status}"

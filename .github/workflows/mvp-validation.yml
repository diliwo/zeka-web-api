                write('native-exits.json',{'exitCodes':status,'utc':times,'missingMeans':'unknown-not-success'})
                failures = [] if all(x == 0 for x in status.values()) and all(v is not None for t in times.values() for v in t.values()) else ['native-command-failure-or-incomplete']

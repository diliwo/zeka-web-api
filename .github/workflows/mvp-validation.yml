              else:
                # Original bytes remain private. Only hashes and labeled derivatives are uploaded.
                manifest = []
                for path in sorted(raw.rglob('*')):
                  if path.is_file() and not path.is_symlink():
                    relative=path.relative_to(raw).as_posix()
                    known=re.fullmatch(r'(build|discovery|focused)\.(stdout|stderr|exit|start|end)|source\.(txt|check.log)|source-check.log|sdk.log|assembly.sha256|expected.json|evidence.py|observe.py|observer-(ready|stop)|observer\.(stdout|stderr)|docker-events\.(private.jsonl|stderr)|results/focused.trx|receipts/gateway-receipts.jsonl|receipts/child-[0-9a-f]{32}/(command.json|child.trx|gateway-receipts.jsonl)',relative)
                    manifest.append({'path':relative if known else 'unrecognized-path-sha256:'+hashlib.sha256(relative.encode()).hexdigest(),'bytes':path.stat().st_size,'sha256':digest(path),'retention':'original-not-uploaded'})

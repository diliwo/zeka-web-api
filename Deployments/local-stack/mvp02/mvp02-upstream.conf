proxy_pass https://gateway.mvp02.zeka-m1.test:8443;
proxy_http_version 1.1;
# Gateway owns forwarding-header rejection and attribution.
proxy_set_header Host app.mvp02.zeka-m1.test:24446;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_name gateway.mvp02.zeka-m1.test;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /run/secrets/fixture-ca.pem;
proxy_cache off;
proxy_buffering off;

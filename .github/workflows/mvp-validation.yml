name: MVP Validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: mvp-validation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  source_policy:
    name: Source Policy
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      trusted: ${{ steps.classify.outputs.trusted }}
    steps:
      - name: Classify pull-request source
        id: classify
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "${HEAD_REPOSITORY}" == "${BASE_REPOSITORY}" ]]; then
            echo "trusted=true" >> "${GITHUB_OUTPUT}"
            echo "Same-repository pull request: protected validation jobs are enabled."
          else
            echo "trusted=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Fork pull request::Secret-dependent validation is intentionally disabled. A maintainer must validate the commit from a same-repository branch."
          fi

  build_and_test:
    name: Build and non-PostgreSQL tests
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out pull-request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Reject tracked NuGet credentials
        run: ./scripts/security/check-nuget-credentials.sh

      - name: Restore solution with ephemeral package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore zeka-web-api.sln --configfile nuget.config

      - name: Build solution
        run: dotnet build zeka-web-api.sln --configuration Release --no-restore

      - name: Run non-PostgreSQL test projects
        shell: bash
        run: |
          test_projects=(
            "Services/AuthManager/Tests/Domain.UnitTests/Domain.UnitTests.csproj"
            "Services/AuthManager/Tests/Application.UnitTests/Application.UnitTests.csproj"
            "Services/AuthManager/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj"
            "Services/AdminAreaManagement/Tests/Domain.UnitTests/Domain.UnitTests.csproj"
            "Services/AdminAreaManagement/Tests/Application.UnitTests/Application.UnitTests.csproj"
            "Services/ClientManagement/Tests/Domain.UnitTests/Domain.UnitTests.csproj"
            "Services/ClientManagement/Tests/Application.UnitTests/Application.UnitTests.csproj"
          )
          test_status=0
          for test_project in "${test_projects[@]}"; do
            echo "::group::dotnet test ${test_project}"
            if ! dotnet test "${test_project}" --configuration Release --no-build --no-restore; then
              test_status=1
            fi
            echo "::endgroup::"
          done
          exit "${test_status}"

  postgresql:
    # Keep the existing required-check name; this job also owns RabbitMQ startup coverage.
    name: PostgreSQL Testcontainers
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out pull-request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Verify Docker daemon availability
        run: docker info

      - name: Restore container-backed test projects with ephemeral package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/AdminAreaManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/AdminAreaManagement/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/ClientManagement/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/ClientManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config

      # AuthenticationStartupTests owns its RabbitMQ/API containers and private network;
      # the runner needs Docker only, with no pre-provisioned broker or credentials.
      - name: Run container-backed integration test projects including real ClientManagement startup
        shell: bash
        run: |
          test_projects=(
            "Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj"
            "Services/AdminAreaManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj"
            "Services/AdminAreaManagement/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj"
            "Services/ClientManagement/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj"
            "Services/ClientManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj"
          )
          test_status=0
          for test_project in "${test_projects[@]}"; do
            echo "::group::dotnet test ${test_project}"
            if ! dotnet test "${test_project}" --configuration Release --no-restore; then
              test_status=1
            fi
            echo "::endgroup::"
          done
          exit "${test_status}"

  life05a_verifier:
    name: LIFE-05A synthetic verifier (exact head)
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Restore AuthManager integration tests with ephemeral package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config

      - name: Verify isolated PostgreSQL role smoke and LIFE-05A purge/verify tests
        env:
          ZEKA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/run-life05a-verifier.sh TestResults/life05a-verifier

      - name: Retain safe LIFE-05A result counts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: life05a-exact-head-verifier
          path: TestResults/life05a-verifier/summary.json
          if-no-files-found: warn
          retention-days: 14

  production_conformance:
    name: Issue 46 production conformance targets
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out pull-request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Verify Docker daemon availability
        run: docker info

      - name: Restore production-conformance harnesses
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/AdminAreaManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/ClientManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Tools/Zeka.DbMigrate.Tests/Zeka.DbMigrate.Tests.csproj --configfile nuget.config

      - name: Run every declared platform target without skips
        run: ./scripts/ci/run-production-conformance.sh TestResults/production-conformance

      - name: Retain focused target evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-46-production-conformance
          path: TestResults/production-conformance
          if-no-files-found: error
          retention-days: 14

  docker_images:
    name: Docker images (4)
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out pull-request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Docker and Compose
        run: |
          docker version
          docker compose version

      - name: Build all four development images with an ephemeral BuildKit secret
        env:
          GITHUB_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
        run: |
          : "${GITHUB_TOKEN:?No package-read credential is available}"
          docker compose --progress plain build \
            adminareaman.api \
            clientman.api \
            authman.api \
            zekaocelotgw

  sonar:
    name: SonarQube Cloud / Quality Gate
    needs: source_policy
    if: ${{ needs.source_policy.outputs.trusted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out full pull-request history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Install pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.14

      - name: Verify SonarQube Cloud prerequisites
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          prerequisite_status=0
          if [[ -z "${SONAR_ORGANIZATION}" ]]; then
            echo "::error title=Missing Sonar variable::Repository variable SONAR_ORGANIZATION is required."
            prerequisite_status=1
          fi
          if [[ -z "${SONAR_PROJECT_KEY}" ]]; then
            echo "::error title=Missing Sonar variable::Repository variable SONAR_PROJECT_KEY is required."
            prerequisite_status=1
          fi
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::error title=Missing Sonar secret::Repository secret SONAR_TOKEN is required."
            prerequisite_status=1
          fi
          exit "${prerequisite_status}"

      - name: Restore scanner and solution with ephemeral package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary :all: \
            --requirement scripts/ci/requirements-coverage.txt
          dotnet tool restore --configfile nuget.config
          dotnet restore zeka-web-api.sln --configfile nuget.config

      - name: Begin pull-request analysis
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PR_BASE: ${{ github.base_ref }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.pullrequest.key="${SONAR_PR_KEY}" \
            /d:sonar.pullrequest.branch="${SONAR_PR_BRANCH}" \
            /d:sonar.pullrequest.base="${SONAR_PR_BASE}" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.python.coverage.reportPaths="TestResults/python-coverage/coverage.xml" \
            /d:sonar.test.inclusions="scripts/ci/tests/test_application_conformance.py" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.token="${SONAR_TOKEN}"

      - name: Build for analysis
        run: dotnet build zeka-web-api.sln --configuration Release --no-restore --no-incremental

      - name: Run Python accounting regressions and collect coverage for analysis
        shell: bash
        run: |
          set -euo pipefail
          coverage_dir="TestResults/python-coverage"
          coverage_file="${coverage_dir}/coverage.xml"
          test_log="${coverage_dir}/tests.log"
          mkdir -p "${coverage_dir}"
          export COVERAGE_FILE="${coverage_dir}/.coverage"
          python -m coverage erase
          python -m coverage run --branch \
            --include='scripts/ci/reconcile_application_conformance.py' \
            -m unittest discover -s scripts/ci/tests -p 'test_application_conformance.py' -v \
            2>&1 | tee "${test_log}"
          if grep -Eq '^OK \(skipped=[1-9][0-9]*\)$' "${test_log}" || ! grep -Eq '^OK$' "${test_log}"; then
            echo "Python accounting regressions did not complete without skips." >&2
            exit 1
          fi
          python -m coverage xml -o "${coverage_file}"
          COVERAGE_FILE="${coverage_file}" python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          coverage_file = Path(os.environ["COVERAGE_FILE"])
          root = ET.parse(coverage_file).getroot()
          classes = root.findall("./packages/package/classes/class")
          expected_file = "scripts/ci/reconcile_application_conformance.py"
          measured = [item for item in classes if item.get("filename") == expected_file]
          try:
              lines_valid = int(root.attrib["lines-valid"])
              lines_covered = int(root.attrib["lines-covered"])
          except (KeyError, TypeError, ValueError) as error:
              raise SystemExit("Python coverage report has invalid line counters.") from error
          if (root.tag != "coverage" or root.get("version") != "7.16.1"
                  or len(classes) != 1 or len(measured) != 1
                  or not measured[0].findall("./lines/line") or lines_valid <= 0):
              raise SystemExit("Python coverage report is malformed or missing the reconciler.")
          if lines_covered * 100 <= lines_valid * 80:
              raise SystemExit("Python reconciler line coverage is not strictly above 80%.")
          print(f"Verified Python reconciler line coverage: {lines_covered}/{lines_valid}")
          PY

      - name: Run complete suite and collect coverage for analysis
        run: |
          docker info
          dotnet test zeka-web-api.sln -m:1 --configuration Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Complete analysis and wait for Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  mvp_validation:
    name: MVP Validation
    needs:
      - source_policy
      - build_and_test
      - postgresql
      - life05a_verifier
      - production_conformance
      - docker_images
      - sonar
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every MVP component
        env:
          TRUSTED_SOURCE: ${{ needs.source_policy.outputs.trusted }}
          BUILD_AND_TEST_RESULT: ${{ needs.build_and_test.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql.result }}
          LIFE05A_VERIFIER_RESULT: ${{ needs.life05a_verifier.result }}
          PRODUCTION_CONFORMANCE_RESULT: ${{ needs.production_conformance.result }}
          DOCKER_IMAGES_RESULT: ${{ needs.docker_images.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          if [[ "${TRUSTED_SOURCE}" != "true" ]]; then
            echo "::error title=Fork validation required::Secret-dependent jobs did not execute. Validate this commit from a same-repository branch before merge."
            exit 1
          fi

          aggregate_status=0
          for component_result in \
            "Build and non-PostgreSQL tests:${BUILD_AND_TEST_RESULT}" \
            "PostgreSQL Testcontainers:${POSTGRESQL_RESULT}" \
            "LIFE-05A synthetic verifier (exact head):${LIFE05A_VERIFIER_RESULT}" \
            "Issue 46 production conformance targets:${PRODUCTION_CONFORMANCE_RESULT}" \
            "Docker images (4):${DOCKER_IMAGES_RESULT}" \
            "SonarQube Cloud / Quality Gate:${SONAR_RESULT}"
          do
            component_name="${component_result%%:*}"
            result="${component_result##*:}"
            if [[ "${result}" == "success" ]]; then
              echo "${component_name}: success"
            else
              echo "::error title=${component_name}::Required component concluded ${result}."
              aggregate_status=1
            fi
          done
          exit "${aggregate_status}"

  # Additional diagnostics only. Existing protected jobs and required aggregate are unchanged.
  trust_probe_diagnostic:
    name: Exact-head trust probe diagnostic
    needs: source_policy
    if: >-
      needs.source_policy.outputs.trusted == 'true' &&
      github.event_name == 'pull_request' && github.repository == 'diliwo/zeka-web-api' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/89-ocelot-trust-probe' &&
      github.event.pull_request.draft == true && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PROBE_PROJECT: Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj
      PROBE_TEST: Infrastructure.IntegrationTests.GatewayHandlerTrustProbeTests.Real_pool_default_validation_fixed_package
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare separate diagnostic evidence
        id: prepare
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_HEAD) { throw 'Exact head mismatch' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cnotmatch '^[a-f0-9]{40}$') { throw 'Exact tree unavailable' }
          $suffix = [guid]::NewGuid().ToString('N')
          $export = Join-Path $env:RUNNER_TEMP "zeka-linux-export-$suffix"
          $outer = Join-Path $env:RUNNER_TEMP "zeka-linux-results-$suffix"
          $probe = Join-Path $env:RUNNER_TEMP "zeka-trust-probe-$suffix"
          if ((Test-Path $export) -or (Test-Path $outer) -or (Test-Path $probe)) { throw 'Evidence path exists' }
          New-Item -ItemType Directory -Path $export,$outer | Out-Null
          "PROBE_EXPORT=$export" >> $env:GITHUB_ENV
          "PROBE_OUTER=$outer" >> $env:GITHUB_ENV
          "ZEKA_TRUST_PROBE_EVIDENCE=$probe" >> $env:GITHUB_ENV
          'ready=true' >> $env:GITHUB_OUTPUT
          @{ schema = 1; head = $head; tree = $tree; workflowMergeSha = $env:GITHUB_SHA;
             checkout = 'exact-PR-head'; independentAcceptance = $false;
             sourceSha256 = @('GatewayHandlerTrustProbeTests.cs','GatewayHandlerTrustProbeSupport.cs') | ForEach-Object {
               @{ path = $_; sha256 = (Get-FileHash -LiteralPath ("Services/AuthManager/Tests/Infrastructure.IntegrationTests/" + $_) -Algorithm SHA256).Hash }
             } } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $export 'source.json')

      - name: Install pinned diagnostic SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Restore diagnostic project with existing read-only mechanism
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          $status = 1
          try {
            if (!$env:PACKAGE_READ_TOKEN) { throw 'Existing package-read credential unavailable' }
            $env:NuGetPackageSourceCredentials_github = "Username=$env:PACKAGE_USERNAME;Password=$env:PACKAGE_READ_TOKEN;ValidAuthenticationTypes=Basic"
            & dotnet restore $env:PROBE_PROJECT --configfile nuget.config --disable-build-servers -p:UseSharedCompilation=false
            $status = $LASTEXITCODE
          } finally {
            Remove-Item Env:NuGetPackageSourceCredentials_github,Env:PACKAGE_READ_TOKEN,Env:PACKAGE_USERNAME -ErrorAction SilentlyContinue
            @{ command = 'dotnet restore probe project existing ephemeral read-only credential'; exitCode = $status; credentialsPersisted = $false } |
              ConvertTo-Json | Set-Content (Join-Path $env:PROBE_EXPORT 'restore.json')
          }
          exit $status

      - name: Compile diagnostic and record actual toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sdk -cne '8.0.129') { throw 'Pinned SDK mismatch' }
          & dotnet build $env:PROBE_PROJECT --configuration Release --no-restore --disable-build-servers -p:UseSharedCompilation=false -m:1 -p:BuildInParallel=false
          $status = $LASTEXITCODE
          $assembly = 'Services/AuthManager/Tests/Infrastructure.IntegrationTests/bin/Release/net8.0/Infrastructure.IntegrationTests.dll'
          @{ schema = 1; command = 'serial Release build no-restore'; exitCode = $status; sdk = $sdk;
             runtimes = @(& dotnet --list-runtimes | ForEach-Object { ($_ -split ' \[')[0] });
             head = $env:EXPECTED_HEAD; tree = (git rev-parse 'HEAD^{tree}').Trim();
             testAssemblySha256 = if ($status -eq 0) { (Get-FileHash -LiteralPath $assembly -Algorithm SHA256).Hash } else { $null };
             historicalEnvironmentEquality = $false } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:PROBE_EXPORT 'build.json')
          exit $status

      - name: Account for unfiltered discovery without claiming execution
        run: |
          $ErrorActionPreference = 'Stop'
          $listing = @(& dotnet test $env:PROBE_PROJECT --configuration Release --no-build --no-restore --list-tests 2>&1)
          $status = $LASTEXITCODE
          $count = @($listing | Where-Object { $_.ToString().Trim() -ceq $env:PROBE_TEST }).Count
          @{ exitCode = $status; test = $env:PROBE_TEST; exactIdentityOccurrences = $count; executionClaim = $false } |
            ConvertTo-Json | Set-Content (Join-Path $env:PROBE_EXPORT 'discovery.json')
          if ($status -ne 0 -or $count -ne 1) { throw 'Exact discovery gate failed' }

      - name: Execute one exact diagnostic test with credential-free environment
        id: execute
        run: |
          $ErrorActionPreference = 'Stop'
          $status = 1; $timedOut = $false; $started = $false; $process = $null
          try {
            $start = [Diagnostics.ProcessStartInfo]::new((Get-Command dotnet).Source)
            $start.UseShellExecute = $false; $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
            $start.WorkingDirectory = $env:GITHUB_WORKSPACE; $start.Environment.Clear()
            foreach ($key in @('PATH','HOME','TMPDIR','TMP','TEMP','DOTNET_ROOT','DOTNET_ROOT_X64','RUNNER_TEMP',
                'GITHUB_ACTIONS','RUNNER_ENVIRONMENT','GITHUB_REPOSITORY','GITHUB_SHA','ImageOS','ImageVersion','ZEKA_TRUST_PROBE_EVIDENCE')) {
              $value = [Environment]::GetEnvironmentVariable($key)
              if ($null -ne $value) { $start.Environment[$key] = $value }
            }
            $start.Environment['DOTNET_CLI_TELEMETRY_OPTOUT'] = '1'
            $start.Environment['DOTNET_SKIP_FIRST_TIME_EXPERIENCE'] = '1'
            $start.Environment['MSBUILDDISABLENODEREUSE'] = '1'
            $start.Environment['DOTNET_CLI_USE_MSBUILD_SERVER'] = '0'
            foreach ($argument in @('test',$env:PROBE_PROJECT,'--configuration','Release','--no-build','--no-restore',
                '--filter',"FullyQualifiedName=$env:PROBE_TEST",'--logger','trx;LogFileName=outer.trx','--results-directory',$env:PROBE_OUTER)) {
              $start.ArgumentList.Add($argument)
            }
            $process = [Diagnostics.Process]::Start($start); $started = $true
            $stdout = $process.StandardOutput.ReadToEndAsync(); $stderr = $process.StandardError.ReadToEndAsync()
            if (!$process.WaitForExit(1200000)) { $timedOut = $true; $process.Kill($true); $process.WaitForExit(10000) | Out-Null }
            [Threading.Tasks.Task]::WaitAll(@($stdout,$stderr))
            $status = if ($timedOut) { 124 } else { $process.ExitCode }
          } finally {
            try { if ($process -and !$process.HasExited) { $process.Kill($true); $process.WaitForExit(10000) | Out-Null } }
            finally {
              @{ schema = 1; test = $env:PROBE_TEST; filter = "FullyQualifiedName=$env:PROBE_TEST"; exitCode = $status;
                 started = $started; timedOut = $timedOut; credentialFreeEnvironment = $true; rawStreamsExported = $false } |
                ConvertTo-Json | Set-Content (Join-Path $env:PROBE_EXPORT 'execution.json')
              if ($process) { $process.Dispose() }
            }
          }
          exit $status

      - name: Export allowlisted native evidence including failed execution
        if: ${{ always() && steps.prepare.outputs.ready == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Copy-Evidence([string]$source,[string]$relative) {
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { return }
            $node = Get-Item -LiteralPath $source
            while ($node -and $node.FullName -cne $env:RUNNER_TEMP) {
              if ($node.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Evidence reparse point forbidden' }
              $node = if ($node -is [IO.FileInfo]) { $node.Directory } else { $node.Parent }
            }
            if (!$node) { throw 'Evidence outside temporary boundary' }
            $destination = Join-Path $env:PROBE_EXPORT $relative
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($destination)) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination
          }
          # Native TRX uses Tests.cs's existing safe outer wrapper; never export raw stdout/stderr or input.json.
          Copy-Evidence (Join-Path $env:PROBE_OUTER 'outer.trx') 'outer.trx'
          foreach ($file in @('receipts.jsonl','diagnostic.jsonl')) {
            Copy-Evidence (Join-Path $env:ZEKA_TRUST_PROBE_EVIDENCE $file) $file
          }
          foreach ($control in @('before-normal','trusted-normal','untrusted-normal','after-normal','before-startup-failure',
              'after-startup-failure','before-abnormal-child','trusted-abnormal-child','untrusted-abnormal-child','terminated-child','after-abnormal-child')) {
            foreach ($file in @('result.json','process.json','result.trx','diagnostic.jsonl')) {
              $relative = "child-$control/$file"
              Copy-Evidence (Join-Path $env:ZEKA_TRUST_PROBE_EVIDENCE $relative) $relative
            }
          }
          $accounting = @{ schema = 1; test = $env:PROBE_TEST; trxPresent = $false; selectionVerified = $false; counters = $null; limitation = 'native-trx-unavailable' }
          $path = Join-Path $env:PROBE_EXPORT 'outer.trx'
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $accounting.trxPresent = $true
            try {
              [xml]$xml = Get-Content -Raw -LiteralPath $path
              $nodes = @($xml.SelectNodes('//*[local-name()="Counters"]'))
              $results = @($xml.SelectNodes('//*[local-name()="UnitTestResult"]'))
              if ($nodes.Count -ne 1 -or $results.Count -ne 1 -or $results[0].testName -cne $env:PROBE_TEST) { throw 'selection' }
              $counts = @{}
              foreach ($key in @('total','executed','passed','failed','notExecuted')) {
                $value = 0
                if (![int]::TryParse($nodes[0].GetAttribute($key),[ref]$value) -or $value -lt 0 -or $value -gt 1) { throw 'counters' }
                $counts[$key] = $value
              }
              if ($counts.total -ne 1 -or $counts.executed -ne 1 -or $counts.notExecuted -ne 0 -or $counts.passed+$counts.failed -ne 1) { throw 'accounting' }
              $accounting.counters = $counts; $accounting.selectionVerified = $true; $accounting.limitation = $null
            } catch { $accounting.limitation = 'native-accounting-unverified' }
          }
          $accounting | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:PROBE_EXPORT 'accounting.json')
          $artifacts = @(Get-ChildItem -LiteralPath $env:PROBE_EXPORT -File -Recurse | Sort-Object FullName | ForEach-Object {
            @{ path = [IO.Path]::GetRelativePath($env:PROBE_EXPORT,$_.FullName); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
          })
          @{ schema = 1; head = $env:EXPECTED_HEAD; tree = (git rev-parse 'HEAD^{tree}').Trim(); artifacts = $artifacts;
             ordinaryProtectedSuites = 'separate unchanged jobs'; historicalEnvironmentEquality = $false; independentAcceptance = $false } |
            ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:PROBE_EXPORT 'manifest.json')
          if (!$accounting.selectionVerified) { throw 'Exact native accounting unverified' }

      - name: Retain separate Linux diagnostic evidence
        if: ${{ always() && steps.prepare.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-linux-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROBE_EXPORT }}
          if-no-files-found: error
          retention-days: 14

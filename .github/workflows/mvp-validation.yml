          export OWNER_PROVIDER_EVIDENCE="$evidence" OWNER_PROVIDER_EXIT="$status"
          python - <<'PY'
          import json, os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          directory = Path(os.environ["OWNER_PROVIDER_EVIDENCE"])
          native = int(os.environ["OWNER_PROVIDER_EXIT"])
          trx = directory / "owner-provider.trx"
          counts, cases = {}, []
          if trx.exists():
              root = ET.parse(trx).getroot()
              ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
              counters = root.find("t:ResultSummary/t:Counters", ns)
              counts = dict(counters.attrib) if counters is not None else {}
              cases = [{"name": item.attrib.get("testName"), "outcome": item.attrib.get("outcome")}
                       for item in root.findall("t:Results/t:UnitTestResult", ns)]
          valid = (native == 0 and counts.get("total") == "4" and counts.get("executed") == "4"
                   and counts.get("passed") == "4" and counts.get("failed") == "0"
                   and counts.get("notExecuted") == "0" and len(cases) == 4
                   and all(item["outcome"] == "Passed" for item in cases))
          (directory / "summary.json").write_text(json.dumps({"schema": "zeka-owner-provider-evidence/v1", "sourceCommit": os.environ["EXPECTED_HEAD"], "nativeExit": native, "mandatoryExpected": 4, "counters": counts, "cases": cases, "status": "PASS" if valid else "FAIL", "ownerWindowsWitness": "NOT_RUN"}, indent=2))
          if not valid:
              raise SystemExit("Mandatory first-admin PostgreSQL inventory or result failed; native output retained privately.")
          PY


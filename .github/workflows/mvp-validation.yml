              check(all(r['failureKind']=='none' and r['unknownOutcomes']==0 and all(x is True for x in r['cleanup'].values()) and r['plannedStartupFailure'] == (r['lifecycle']=='startup-failure') for r in lifecycles), 'cleanup-failure-or-unknown')

          if __name__ == '__main__':
            stage = 'discovery' if sys.argv[1] == 'discovery' else 'export'
            try:

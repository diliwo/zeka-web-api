services:
  adminareaman.api:
    image: diliwo/adminareamanapi
    container_name: zekaadminareaapi
    build:
      context: .
      dockerfile: Services/AdminAreaManagement/AdminAreaManagement.API/Dockerfile
      secrets:
        - github_token
    depends_on:
      rabbitmq :
        condition: service_healthy
      zekadb :
        condition: service_healthy

  clientman.api:
    image: diliwo/clientmanapi
    container_name: zekaclientapi
    build:
      context: .
      dockerfile: Services/ClientManagement/Client.API/Dockerfile
      secrets:
        - github_token
    depends_on:
      rabbitmq :
        condition: service_healthy
      zekadb :
        condition: service_healthy
  
  zekaocelotgw:
     image: diliwo/ocelotapigateway
     build:
      context: .
      dockerfile: ApiGateways/Ocelot.ApiGateway/Dockerfile
      secrets:
        - github_token
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-host
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 1s
      timeout: 5s
      retries: 5

  authman.api:
    image: diliwo/authmanapi
    container_name: zekaauthapi
    build:
        context: .
        dockerfile: Services/AuthManager/AuthManager.API/Dockerfile
        secrets:
          - github_token
    depends_on:
      zekadb :
        condition: service_healthy
  
  zekadb:
    image: postgres:17
    container_name: zekadb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin #${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  postgres_data:
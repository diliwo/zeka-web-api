name: C1 validation

on:
  pull_request:
    branches: [codex/m1-c1-integration]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [codex/m1-c1-integration]

permissions: {}

env:
  BASELINE_PATH: scripts/ci/c1-ratchet/baseline-v1.json
  ANCHOR_SHA: 23ad61e84ae976b6a483d2a859871c3b40d98249

jobs:
  context:
    name: Resolve C1 ratchet context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.resolve.outputs.candidate }}
      base: ${{ steps.resolve.outputs.base }}
      context: ${{ steps.resolve.outputs.context }}
      tooling: ${{ steps.resolve.outputs.tooling }}
    steps:
      - name: Check out the exact event object and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: resolve
        name: Resolve the candidate, base, trees and run identity
        shell: bash
        run: |
          set -euo pipefail
          c1=refs/heads/codex/m1-c1-integration
          test "$GITHUB_REPOSITORY" = diliwo/zeka-web-api
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              jq -e --arg repo "$GITHUB_REPOSITORY" '
                .pull_request.head.repo.full_name == $repo and
                .pull_request.base.repo.full_name == $repo and
                .pull_request.base.ref == "codex/m1-c1-integration"
              ' "$GITHUB_EVENT_PATH" >/dev/null
              candidate=$(jq -er .pull_request.head.sha "$GITHUB_EVENT_PATH")
              base=$(jq -er .pull_request.base.sha "$GITHUB_EVENT_PATH")
              ;;
            push)
              test "$GITHUB_REF" = "$c1"
              jq -e --arg ref "$c1" '.ref == $ref and .deleted == false and .forced == false' \
                "$GITHUB_EVENT_PATH" >/dev/null
              candidate=$(jq -er .after "$GITHUB_EVENT_PATH")
              base=$(jq -er .before "$GITHUB_EVENT_PATH")
              test "$candidate" = "$GITHUB_SHA"
              ;;
            *) echo 'Unsupported C1 event.' >&2; exit 1 ;;
          esac
          [[ $candidate =~ ^[0-9a-f]{40}$ && $base =~ ^[0-9a-f]{40}$ ]]
          [[ $candidate != "$base" && $base != 0000000000000000000000000000000000000000 ]]
          git merge-base --is-ancestor "$ANCHOR_SHA" "$base"
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            git merge-base --is-ancestor "$base" "$candidate"
          fi
          test_tree=$(git rev-parse "$candidate^{tree}")
          base_tree=$(git rev-parse "$base^{tree}")
          tooling=$base
          if ! git cat-file -e "$base:$BASELINE_PATH"; then
            # The first reviewed C1 PR supplies tooling. Its baseline must match
            # the comparator's separately pinned initial policy for the exact anchor.
            test "$base" = "$ANCHOR_SHA"
            tooling=$candidate
          fi
          for file in "$BASELINE_PATH" scripts/ci/c1_ratchet.py scripts/ci/c1_ratchet_trx.py scripts/ci/run-c1-ratchet.sh; do
            test "$(git cat-file -t "$tooling:$file")" = blob
          done
          context=$(jq -nc --arg event "$GITHUB_EVENT_NAME" --arg candidate "$candidate" \
            --arg base "$base" --arg testTree "$test_tree" --arg baseTree "$base_tree" \
            --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{schema:1,event:$event,candidate:$candidate,base:$base,testTree:$testTree,
              baseTree:$baseTree,runId:$runId,runAttempt:$runAttempt,repository:$repository}')
          printf 'candidate=%s\nbase=%s\ntooling=%s\ncontext=%s\n' \
            "$candidate" "$base" "$tooling" "$context" >>"$GITHUB_OUTPUT"

  test:
    name: C1 ${{ matrix.role }} ${{ matrix.lane }}
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        role: [base, candidate]
        lane: [non-postgres, postgresql, sonar-suite, production-conformance, owner-provision, gateway]
    env:
      LANE: ${{ matrix.lane }}
      ROLE: ${{ matrix.role }}
      CONTEXT_JSON: ${{ needs.context.outputs.context }}
      SOURCE_SHA: ${{ matrix.role == 'base' && needs.context.outputs.base || needs.context.outputs.candidate }}
    steps:
      - name: Check out exact test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Check out ratchet tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.tooling }}
          path: tooling
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.129

      - name: Allocate private output and sanitized artifact paths
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw=$(mktemp -d "$RUNNER_TEMP/c1-ratchet-$ROLE-$LANE.XXXXXX")
          safe=$(mktemp -d "$RUNNER_TEMP/c1-ratchet-safe.XXXXXX")
          printf '%s\n' "$CONTEXT_JSON" >"$raw/context.json"
          printf 'RATCHET_RAW=%s\nRATCHET_SAFE=%s\n' "$raw" "$safe" >>"$GITHUB_ENV"

      - name: Reject tracked NuGet credentials before credential delivery
        shell: bash
        working-directory: source
        run: bash scripts/security/check-nuget-credentials.sh

      - name: Restore and prepare the profile
        shell: bash
        working-directory: source
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          bash "$GITHUB_WORKSPACE/tooling/scripts/ci/run-c1-ratchet.sh" prepare \
            "$RATCHET_RAW/context.json" "$LANE" "$ROLE" "$RATCHET_RAW"

      - name: Install pinned standalone Sonar CLI for original scanner-aware tests
        if: ${{ matrix.lane == 'non-postgres' || matrix.lane == 'sonar-suite' }}
        shell: bash
        run: |
          set -euo pipefail
          version=1.9.0.15656
          expected=42ec815ef8015921a76b76c865932130d756c5c5a977d82bca9fa81d09bfccd8
          bin=$(mktemp -d "$RUNNER_TEMP/c1-ratchet-sonar.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 2 --connect-timeout 15 --max-time 90 \
            --output "$bin/sonar" \
            "https://binaries.sonarsource.com/Distribution/sonarqube-cli/$version/linux/sonarqube-cli-$version-linux-x86-64.bin"
          printf '%s  %s\n' "$expected" "$bin/sonar" | sha256sum --check --status
          chmod 0700 "$bin/sonar"
          test "$("$bin/sonar" --version)" = 1.9.0
          printf '%s\n' "$bin" >>"$GITHUB_PATH"

      - name: Execute test profile
        shell: bash
        working-directory: source
        env:
          SONARQUBE_CLI_SERVER: https://sonarcloud.io
          SONARQUBE_CLI_ORG: ${{ (matrix.lane == 'non-postgres' || matrix.lane == 'sonar-suite') && vars.SONAR_ORGANIZATION || '' }}
          SONARQUBE_CLI_TOKEN: ${{ (matrix.lane == 'non-postgres' || matrix.lane == 'sonar-suite') && secrets.SONAR_TOKEN || '' }}
        run: |
          bash "$GITHUB_WORKSPACE/tooling/scripts/ci/run-c1-ratchet.sh" execute \
            "$RATCHET_RAW/context.json" "$LANE" "$ROLE" "$RATCHET_RAW"

      - name: Normalize TRX evidence without test output
        if: ${{ always() }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tooling/scripts/ci/c1_ratchet.py" capture \
            --context "$RATCHET_RAW/context.json" --lane "$LANE" --role "$ROLE" \
            --baseline "$GITHUB_WORKSPACE/tooling/$BASELINE_PATH" \
            --run-inputs "$RATCHET_RAW" --out "$RATCHET_SAFE/$ROLE-$LANE.json"

      - name: Upload only sanitized test identity and result evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c1-ratchet-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}-${{ matrix.lane }}
          path: ${{ env.RATCHET_SAFE }}/${{ matrix.role }}-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 14

  ratchet:
    name: C1 Failure Ratchet
    needs: [context, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      CONTEXT_JSON: ${{ needs.context.outputs.context }}
      CONTEXT_RESULT: ${{ needs.context.result }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: Check out the admitted comparator
        if: ${{ needs.context.result == 'success' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.tooling }}
          path: tooling
          persist-credentials: false

      - name: Check out proposed baseline
        if: ${{ needs.context.result == 'success' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.candidate }}
          path: candidate
          persist-credentials: false

      - name: Check out accepted baseline
        if: ${{ needs.context.result == 'success' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.base }}
          path: base
          persist-credentials: false

      - name: Download this attempt's sanitized evidence
        id: evidence
        if: ${{ always() && needs.context.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: c1-ratchet-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: evidence

      - name: Compare test inventories and independently inspect every required job
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_RESULT: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/c1-ratchet-receipt" evidence
          receipt="$RUNNER_TEMP/c1-ratchet-receipt"
          printf '%s\n' "$CONTEXT_JSON" >"$receipt/context.json"
          compare=1
          if [[ $CONTEXT_RESULT == success ]]; then
            compare=0
            python3 tooling/scripts/ci/c1_ratchet.py compare \
              --context "$receipt/context.json" --evidence evidence \
              --baseline "candidate/$BASELINE_PATH" --base-baseline "base/$BASELINE_PATH" \
              --out "$receipt/comparison.json" || compare=$?
          fi
          query=0
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            >"$RUNNER_TEMP/c1-ratchet-native-jobs.json" || query=$?
          export COMPARE_EXIT=$compare JOB_API_EXIT=$query
          python3 - "$RUNNER_TEMP/c1-ratchet-native-jobs.json" "$receipt/upstream-jobs.json" <<'PY'
          import itertools
          import json
          import os
          from pathlib import Path
          import sys

          source, receipt = map(Path, sys.argv[1:])
          lanes = ("non-postgres", "postgresql", "sonar-suite", "production-conformance", "owner-provision", "gateway")
          expected = {f"C1 {role} {lane}" for role, lane in itertools.product(("base", "candidate"), lanes)}
          errors = []
          selected = {}
          context = json.loads(os.environ["CONTEXT_JSON"]) if os.environ["CONTEXT_RESULT"] == "success" else {}
          if os.environ["JOB_API_EXIT"] != "0":
              errors.append("UPSTREAM_JOB_QUERY_FAILED")
          else:
              try:
                  for page in json.loads(source.read_text(encoding="utf-8")):
                      for job in page["jobs"]:
                          name = job["name"]
                          if name not in expected:
                              continue
                          if name in selected:
                              errors.append("DUPLICATE_UPSTREAM_JOB")
                              continue
                          required = {"Check out exact test source", "Check out ratchet tooling",
                                      "Install pinned .NET SDK", "Allocate private output and sanitized artifact paths",
                                      "Reject tracked NuGet credentials before credential delivery",
                                      "Restore and prepare the profile", "Execute test profile",
                                      "Normalize TRX evidence without test output",
                                      "Upload only sanitized test identity and result evidence"}
                          if name.endswith((" non-postgres", " sonar-suite")):
                              required.add("Install pinned standalone Sonar CLI for original scanner-aware tests")
                          steps = {step["name"]: step["conclusion"] for step in job["steps"]}
                          if (len(steps) != len(job["steps"]) or not required <= steps.keys()
                                  or any(steps[item] != "success" for item in required - {"Execute test profile"})
                                  or steps.get("Execute test profile") != job["conclusion"]):
                              errors.append("UPSTREAM_REQUIRED_STEPS_INCOMPLETE")
                          failures = [step["name"] for step in job["steps"] if step["conclusion"] == "failure"]
                          selected[name] = {"id": job["id"], "status": job["status"],
                                            "conclusion": job["conclusion"],
                                            "onlyTestExecutionFailed": failures == ["Execute test profile"]}
                          if (job["head_sha"] != context.get("candidate") or job["status"] != "completed"
                                  or job["run_id"] != int(os.environ["GITHUB_RUN_ID"])
                                  or job["run_attempt"] != int(os.environ["GITHUB_RUN_ATTEMPT"])):
                              errors.append("UPSTREAM_JOB_IDENTITY_OR_STATUS")
                          if job["conclusion"] == "success":
                              if failures:
                                  errors.append("INCONSISTENT_UPSTREAM_JOB")
                          elif job["conclusion"] != "failure" or failures != ["Execute test profile"]:
                              errors.append("UPSTREAM_INFRASTRUCTURE_FAILURE")
              except (KeyError, OSError, TypeError, ValueError):
                  errors.append("MALFORMED_UPSTREAM_JOB_EVIDENCE")
          if set(selected) != expected:
              errors.append("MISSING_REQUIRED_UPSTREAM_JOB")
          if (os.environ["CONTEXT_RESULT"] != "success" or os.environ["TEST_RESULT"] not in ("success", "failure")
                  or os.environ["DOWNLOAD_RESULT"] != "success" or os.environ["COMPARE_EXIT"] != "0"):
              errors.append("INCOMPLETE_OR_REJECTED_RATCHET_EVIDENCE")
          receipt.write_text(json.dumps({"schema": 1, "jobs": selected, "errors": sorted(set(errors)),
                                         "status": "FAIL" if errors else "PASS"}, indent=2) + "\n", encoding="utf-8")
          if errors:
              raise SystemExit("C1 Failure Ratchet rejected upstream or comparison evidence.")
          PY

      - name: Retain comparison and required-job receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c1-ratchet-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c1-ratchet-receipt/comparison.json
            ${{ runner.temp }}/c1-ratchet-receipt/upstream-jobs.json
          if-no-files-found: error
          retention-days: 14

          PY
          cat > "$raw/observe.py" <<'PY'
          # Dedicated read-only observer for this focused interval; never deletes resources.
          import datetime, hashlib, json, os, pathlib, re, select, subprocess, time
          raw, safe = pathlib.Path(os.environ['GATEWAY_RAW']), pathlib.Path(os.environ['GATEWAY_SAFE'])
          def native(args):
              p = subprocess.run(['docker',*args],capture_output=True,timeout=5,check=False)
              if p.returncode: raise RuntimeError('docker-observation-failed')
              return p.stdout
          def ids(): return native(['ps','-aq','--no-trunc']).decode().split()
          def utc(): return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def full(value): return bool(re.fullmatch('[0-9a-f]{64}',value or ''))
          records, snapshots, baseline, errors = [], {}, [], []
          stream = None; start = utc()
          try:
              baseline = ids()
              daemon = json.loads(native(['info','--format','{{json .}}']))
              daemon = {k:daemon.get(k) for k in ['ID','ServerVersion','OSType','Architecture']}
              # Existing containers are never attributed or removed; nonempty TC baseline fails.
              if native(['ps','-aq','--filter','label=org.testcontainers=true']).strip(): raise RuntimeError('testcontainers-baseline-not-empty')
              stream = subprocess.Popen(['docker','events','--since',start,'--filter','type=container','--filter','label=org.testcontainers=true','--format','{{json .}}'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,bufsize=0)
              (raw/'observer-ready').write_text('ready')
              deadline = time.monotonic()+5400
              pending=b''
              with (raw/'docker-events.private.jsonl').open('wb') as original:
                while not (raw/'observer-stop').exists() and time.monotonic()<deadline:
                  if stream.poll() is not None: raise RuntimeError('event-stream-ended')
                  if b'\n' not in pending:
                    if not select.select([stream.stdout],[],[],0.25)[0]: continue
                    chunk=os.read(stream.stdout.fileno(),65536)
                    if not chunk or len(pending)+len(chunk)>1000000: raise RuntimeError('event-line-unavailable-or-size')
                    pending+=chunk
                    continue
                  line,pending=pending.split(b'\n',1); line+=b'\n'
                  original.write(line); original.flush()
                  if original.tell()>10000000 or len(records)>20000: raise RuntimeError('event-limit')
                  event=json.loads(line); action=event.get('Action'); actor=event.get('Actor',{}); cid=actor.get('ID'); a=actor.get('Attributes',{})
                  if action not in {'create','start','stop','die','destroy','kill'}: continue
                  if not full(cid) or cid in baseline or a.get('org.testcontainers')!='true': raise RuntimeError('event-attribution')
                  name=a.get('name',''); image=a.get('image','')
                  if not re.fullmatch('[a-zA-Z0-9_.-]{1,160}',name): raise RuntimeError('container-name')
                  if image!='postgres:17-alpine' and not image.startswith('testcontainers/ryuk:'): raise RuntimeError('unexpected-testcontainer-image')
                  labels={k:a[k] for k in ['org.testcontainers','org.testcontainers.lang','org.testcontainers.version','org.testcontainers.session-id','org.testcontainers.resource-reaper-session'] if k in a}
                  if any(not re.fullmatch('[a-zA-Z0-9.+-]{1,100}',v) for v in labels.values()): raise RuntimeError('label-format')
                  exit_code=a.get('exitCode'); exit_code=int(exit_code) if exit_code is not None and re.fullmatch('-?[0-9]{1,10}',exit_code) else None
                  records.append({'id':cid,'action':action,'timeNano':int(event['timeNano']),'name':name,'image':image,'labels':labels,'exitCode':exit_code})
                  if action=='start':
                    try:
                      data=json.loads(native(['inspect',cid]))[0]
                      if data['Id']!=cid or data['Name'].lstrip('/')!=name or data['Config']['Image']!=image or any(data['Config']['Labels'].get(k)!=v for k,v in labels.items()) or not data['State']['Running']:
                        raise RuntimeError('post-start-identity')
                      ports=data['NetworkSettings']['Ports']
                      if not ports or any(not bindings for bindings in ports.values()): raise RuntimeError('ports-unresolved')
                      for port,bindings in ports.items():
                        if not re.fullmatch('[0-9]{1,5}/(tcp|udp)',port): raise RuntimeError('port-format')
                        for b in bindings:
                          if set(b)!={'HostIp','HostPort'} or not re.fullmatch('[0-9a-fA-F:.]{1,45}',b['HostIp']) or not re.fullmatch('[0-9]{1,5}',b['HostPort']): raise RuntimeError('binding-format')
                      image_id=data['Image']
                      if not re.fullmatch('sha256:[0-9a-f]{64}',image_id): raise RuntimeError('image-id')
                      digests=json.loads(native(['image','inspect',image_id,'--format','{{json .RepoDigests}}']))
                      if not digests or any(not re.fullmatch('[a-zA-Z0-9./_-]+@sha256:[0-9a-f]{64}',d) for d in digests): raise RuntimeError('image-digest')
                      mounts=[{'type':m['Type'],'destination':m['Destination'] if m['Destination'] in {'/var/run/docker.sock','/var/lib/postgresql/data','/var/lib/postgresql'} else 'other','rw':m['RW'],'sourceSha256':hashlib.sha256(m.get('Source','').encode()).hexdigest(),'dockerSocket':m['Destination']=='/var/run/docker.sock'} for m in data['Mounts']]
                      snapshots[cid]={'id':cid,'observedUtc':utc(),'name':name,'image':image,'imageId':image_id,'repoDigests':digests,'labels':labels,'ports':ports,'privileged':data['HostConfig']['Privileged'],'readOnlyRoot':data['HostConfig']['ReadonlyRootfs'],'networkMode':data['HostConfig']['NetworkMode'] if data['HostConfig']['NetworkMode'] in {'default','bridge'} else 'other','mounts':mounts,'state':'running'}
                    except Exception: errors.append({'id':cid,'stage':'post-start-observation-unknown'})
                if time.monotonic()>=deadline: errors.append({'stage':'observer-deadline'})
          except Exception:
              errors.append({'stage':'docker-observation-unavailable'})
          finally:
              if stream is not None:
                stream.terminate()
                try: out,err=stream.communicate(timeout=10)
                except subprocess.TimeoutExpired:
                  stream.kill(); out,err=stream.communicate(timeout=10); errors.append({'stage':'event-stream-forced-kill'})
                # Tail not processed is unknown, never credited as completed observations.
                if out.strip() or locals().get('pending',b'').strip(): errors.append({'stage':'unprocessed-event-tail'})
                (raw/'docker-events.stderr').write_bytes(err)
              try:
                final=ids()
                daemon_post=json.loads(native(['info','--format','{{json .}}']))
                daemon_post={k:daemon_post.get(k) for k in ['ID','ServerVersion','OSType','Architecture']}
                if daemon_post!=daemon: errors.append({'stage':'daemon-drift'})
              except Exception: final=None; daemon_post=None; errors.append({'stage':'final-inventory-unknown'})
              children={r['id'] for r in records}
              residual=None if final is None else sorted(children & set(final))
              if final is not None and set(final)-set(baseline)-children: errors.append({'stage':'unattributed-new-resources'})
              for cid in children:
                actions={r['action'] for r in records if r['id']==cid}
                if cid not in snapshots or not {'create','start','die','destroy'}<=actions or not any(r['id']==cid and r['action']=='die' and r['exitCode'] is not None for r in records): errors.append({'id':cid,'stage':'incomplete-lifecycle'})
              sessions={s['labels'].get('org.testcontainers.resource-reaper-session') for s in snapshots.values() if s['image']=='postgres:17-alpine'}
              ryuk={s['name'].removeprefix('testcontainers-ryuk-') for s in snapshots.values() if s['image'].startswith('testcontainers/ryuk:')}
              if not sessions or None in sessions or sessions!=ryuk: errors.append({'stage':'session-attribution-incomplete'})
              value={'schema':'allowlisted-docker-observation-v1','startedUtc':start,'finishedUtc':utc(),'daemonPre':locals().get('daemon'),'daemonPost':daemon_post,'baselineIds':baseline,'finalIds':final,'events':records,'postStartSnapshots':list(snapshots.values()),'residualIds':residual,'errors':errors,'localOnlyExposure':'UNKNOWN_LOCAL_ONLY_EXPOSURE','cleanup':'Testcontainers-owned disposal and Ryuk only; observer performs no mutation','gate':'complete' if children and not errors and residual==[] else 'incomplete'}
              (safe/'docker.sanitized.json').write_text(json.dumps(value,indent=2)+'\n')
          PY


      - name: Restore container-backed test projects with ephemeral package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.ZEKA_PACKAGES_READ_TOKEN || github.token }}
          PACKAGE_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${PACKAGE_READ_TOKEN:?No package-read credential is available}"
          export NuGetPackageSourceCredentials_github="Username=${PACKAGE_USERNAME};Password=${PACKAGE_READ_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/AdminAreaManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/AdminAreaManagement/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/ClientManagement/Tests/Application.IntegrationTests/Application.IntegrationTests.csproj --configfile nuget.config
          dotnet restore Services/ClientManagement/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configfile nuget.config

      - name: Build exact-head AuthManager gateway test assembly
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          project=Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj
          status=0
          date -u +%FT%TZ > "$GATEWAY_RAW/build.start"
          timeout --signal=TERM --kill-after=10s 1800s dotnet build "$project" --configuration Release --no-restore -m:1 > "$GATEWAY_RAW/build.stdout" 2> "$GATEWAY_RAW/build.stderr" || status=$?
          date -u +%FT%TZ > "$GATEWAY_RAW/build.end"
          printf '%s\n' "$status" > "$GATEWAY_RAW/build.exit"
          test "$status" -eq 0
          sha256sum Services/AuthManager/Tests/Infrastructure.IntegrationTests/bin/Release/net8.0/Infrastructure.IntegrationTests.dll | cut -d ' ' -f 1 > "$GATEWAY_RAW/assembly.sha256"

      - name: Discover the exact gateway class cases
        shell: bash
        run: |
          set -euo pipefail
          status=0
          date -u +%FT%TZ > "$GATEWAY_RAW/discovery.start"
          timeout --signal=TERM --kill-after=10s 300s dotnet test Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configuration Release --no-build --no-restore --list-tests > "$GATEWAY_RAW/discovery.stdout" 2> "$GATEWAY_RAW/discovery.stderr" || status=$?
          date -u +%FT%TZ > "$GATEWAY_RAW/discovery.end"
          printf '%s\n' "$status" > "$GATEWAY_RAW/discovery.exit"
          python3 "$GATEWAY_RAW/evidence.py" discovery

      - name: Run the gateway class once with native TLS and cleanup receipts
        shell: bash
        env:
          ZEKA_GATEWAY_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          test -z "${PACKAGE_READ_TOKEN+x}${NuGetPackageSourceCredentials_github+x}"
          export ZEKA_GATEWAY_EVIDENCE="$GATEWAY_RAW/receipts"
          python3 "$GATEWAY_RAW/observe.py" > "$GATEWAY_RAW/observer.stdout" 2> "$GATEWAY_RAW/observer.stderr" &
          observer=$!
          finish_observer() {
            touch "$GATEWAY_RAW/observer-stop"
            # The observer's Docker calls and stream drains are independently bounded.
            wait "$observer" || true
          }
          trap finish_observer EXIT
          for attempt in {1..100}; do
            test ! -e "$GATEWAY_SAFE/docker.sanitized.json" || exit 1
            test ! -e "$GATEWAY_RAW/observer-ready" || break
            sleep 0.25
          done
          test -e "$GATEWAY_RAW/observer-ready"
          status=0
          date -u +%FT%TZ > "$GATEWAY_RAW/focused.start"
          timeout --signal=TERM --kill-after=10s 4800s dotnet test Services/AuthManager/Tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter 'FullyQualifiedName~Infrastructure.IntegrationTests.GatewayBrowserTransportTests.' --logger 'trx;LogFileName=focused.trx' --results-directory "$GATEWAY_RAW/results" > "$GATEWAY_RAW/focused.stdout" 2> "$GATEWAY_RAW/focused.stderr" || status=$?
          date -u +%FT%TZ > "$GATEWAY_RAW/focused.end"
          printf '%s\n' "$status" > "$GATEWAY_RAW/focused.exit"
